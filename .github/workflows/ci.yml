name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: typecheck, schema & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npx drizzle-kit push --force

      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm exec tsc -- --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests
        run: node --experimental-strip-types --test scripts/test-units.mjs

      - name: Build
        run: npm run build

      - name: Verify production boot + health
        run: |
          npm start & SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "health check passed"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "server did not become healthy in time" >&2
              exit 1
            fi
            sleep 1
          done
